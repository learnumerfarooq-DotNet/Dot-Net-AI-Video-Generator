<div class="page-content scheduler-container" *ngIf="store.scheduler() as scheduler">
  <section class="panel">
    <header class="panel-header">
      <h2>Queue Operations</h2>
      <i class="fa-solid fa-layer-group"></i>
    </header>
    <div class="jobs-list">
      <article class="job-card" *ngFor="let job of scheduler.queueJobs">
        <div class="job-info">
          <div class="job-title">{{ job.name }}</div>
          <div class="job-meta">{{ job.queueMode }} &bull; {{ job.notes }}</div>
        </div>
        <span class="job-status status-active">{{ job.status }}</span>
      </article>
      <div class="empty-state" *ngIf="!scheduler.queueJobs.length">
        <i class="fa-solid fa-list-check"></i>
        <p>No queued operations.</p>
      </div>
    </div>
  </section>
</div>
