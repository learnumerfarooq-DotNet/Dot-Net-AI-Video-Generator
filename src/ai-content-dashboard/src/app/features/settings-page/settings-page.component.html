<section class="content-grid single" *ngIf="store.activeAgent() as agent">
  <section class="panel" *ngIf="store.activeAgentSettings() as settings">
    <div class="panel-heading">
      <div>
        <h2>{{ settings.agentName }} Settings</h2>
        <span>{{ settings.category }} / {{ settings.isConnected ? 'Connected' : 'Connect API first' }}</span>
      </div>
      <button
        type="button"
        class="primary-button"
        [disabled]="store.savingAgentKey() === agent.key"
        (click)="store.saveAgentSettings(agent.key)">
        <i class="fa-solid fa-floppy-disk"></i>
        <span>{{ store.savingAgentKey() === agent.key ? 'Saving...' : 'Save Settings' }}</span>
      </button>
    </div>

    <div class="form-grid">
      <label>
        Provider
        <select
          [ngModel]="store.settingsDraft(agent.key).providerName"
          (ngModelChange)="store.updateSettingsDraft(agent.key, 'providerName', $event)">
          <option *ngFor="let option of store.providerOptionsForActiveAgent()" [value]="option">{{ option }}</option>
        </select>
      </label>

      <label>
        Model
        <input [ngModel]="store.settingsDraft(agent.key).modelName" (ngModelChange)="store.updateSettingsDraft(agent.key, 'modelName', $event)" />
      </label>

      <label>
        Base URL
        <input [ngModel]="store.settingsDraft(agent.key).baseUrl" (ngModelChange)="store.updateSettingsDraft(agent.key, 'baseUrl', $event)" />
      </label>

      <label>
        API Key
        <input type="password" [ngModel]="store.settingsDraft(agent.key).apiKey" (ngModelChange)="store.updateSettingsDraft(agent.key, 'apiKey', $event)" />
      </label>

      <label>
        Client ID
        <input [ngModel]="store.settingsDraft(agent.key).clientId" (ngModelChange)="store.updateSettingsDraft(agent.key, 'clientId', $event)" />
      </label>

      <label>
        Client Secret
        <input type="password" [ngModel]="store.settingsDraft(agent.key).clientSecret" (ngModelChange)="store.updateSettingsDraft(agent.key, 'clientSecret', $event)" />
      </label>

      <label>
        Refresh Token
        <input [ngModel]="store.settingsDraft(agent.key).refreshToken" (ngModelChange)="store.updateSettingsDraft(agent.key, 'refreshToken', $event)" />
      </label>

      <label>
        Google Drive Folder
        <input [ngModel]="store.settingsDraft(agent.key).storageFolderId" (ngModelChange)="store.updateSettingsDraft(agent.key, 'storageFolderId', $event)" />
      </label>
    </div>

    <label class="toggle-line" *ngIf="settings.supportsOpenRouter">
      <input type="checkbox" [ngModel]="store.settingsDraft(agent.key).useOpenRouter" (ngModelChange)="store.updateSettingsDraft(agent.key, 'useOpenRouter', $event)" />
      <span>Use OpenRouter for this agent</span>
    </label>

    <div class="form-grid" *ngIf="settings.supportsOpenRouter && store.settingsDraft(agent.key).useOpenRouter">
      <label>
        OpenRouter Model
        <input [ngModel]="store.settingsDraft(agent.key).openRouterModel" (ngModelChange)="store.updateSettingsDraft(agent.key, 'openRouterModel', $event)" />
      </label>

      <label>
        OpenRouter API Key
        <input type="password" [ngModel]="store.settingsDraft(agent.key).openRouterApiKey" (ngModelChange)="store.updateSettingsDraft(agent.key, 'openRouterApiKey', $event)" />
      </label>
    </div>

    <label>
      Notes / Agent-Specific Details
      <textarea rows="6" [ngModel]="store.settingsDraft(agent.key).notes" (ngModelChange)="store.updateSettingsDraft(agent.key, 'notes', $event)"></textarea>
    </label>
  </section>
</section>
