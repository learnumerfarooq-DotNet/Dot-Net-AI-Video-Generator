<div class="page-content scheduler-container">
  <section class="panel">
    <header class="panel-header">
      <h2>Daily Posting Automation</h2>
      <i class="fa-solid fa-clock"></i>
    </header>
    <div class="jobs-list">
      <article class="job-card" *ngFor="let job of schedulerStore.dailyPostingJobs()">
        <div class="job-info">
          <div class="job-title">{{ job.name }}</div>
          <div class="job-meta">
            <span class="job-status status-active">{{ job.status }}</span>
            {{ job.agentKey }} &bull; Next: {{ job.nextRunAt | date:'MMM d, h:mm a' }}
          </div>
        </div>
        <i class="fa-solid fa-repeat" style="opacity:0.5"></i>
      </article>
      <div class="empty-state" *ngIf="!schedulerStore.dailyPostingJobs().length">
        <i class="fa-solid fa-calendar-day"></i>
        <p>No daily jobs configured yet.</p>
      </div>
    </div>
  </section>
</div>
