<div class="h-full flex flex-col gap-8 animate-fade-in">
  
  <!-- Header & Stats -->
  <div class="premium-card p-8 flex justify-between items-center relative overflow-hidden">
    <div class="absolute -right-20 -top-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
    <div class="z-10">
      <h2 class="text-3xl font-black tracking-tighter">Daily Posting Flow</h2>
      <p class="text-sm text-text-muted mt-2">Automated content distribution sequence for today</p>
    </div>
    
    <div class="flex gap-12 z-10">
      <div class="text-center">
        <span class="text-[10px] font-black text-text-muted uppercase tracking-widest block mb-2">Target</span>
        <div class="text-2xl font-black">12 <span class="text-xs text-text-muted">videos</span></div>
      </div>
      <div class="w-px h-12 bg-border-soft"></div>
      <div class="text-center">
        <span class="text-[10px] font-black text-text-muted uppercase tracking-widest block mb-2">Efficiency</span>
        <div class="text-2xl font-black text-success">98%</div>
      </div>
    </div>
  </div>

  <!-- Timeline View -->
  <div class="premium-card flex-1 flex flex-col min-h-0 overflow-hidden">
    <div class="p-6 border-b border-border-soft flex justify-between items-center bg-surface-strong/20 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary shadow-inner">
          <i class="fa-solid fa-timeline"></i>
        </div>
        <h3 class="text-lg font-bold">24-Hour Production Cycle</h3>
      </div>
      <div class="flex gap-4">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-bg-deep/50 border border-border-soft">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
          <span class="text-[10px] font-black text-text-muted uppercase tracking-widest">Pending</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-bg-deep/50 border border-border-soft">
          <span class="w-2 h-2 rounded-full bg-success"></span>
          <span class="text-[10px] font-black text-text-muted uppercase tracking-widest">Completed</span>
        </div>
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
      <div class="relative pl-12 border-l border-border-soft ml-4">
        
        <div *ngFor="let hour of hours" class="relative min-h-[40px] mb-8 last:mb-0">
          <!-- Hour Label -->
          <div class="absolute -left-24 top-1 w-20 text-right text-xs font-black text-text-muted uppercase tracking-tighter">
            {{ formatHour(hour) }}
          </div>
          
          <!-- Timeline Marker -->
          <div class="absolute top-1.5 w-3 h-3 rounded-full border-2 border-border-soft bg-bg-deep z-10 shadow-[0_0_10px_rgba(0,0,0,0.5)]" style="left: -3.375rem;">
            <div class="w-full h-full rounded-full" [class.bg-primary]="getJobsForHour(hour).length > 0 && getJobsForHour(hour)[0].status !== 'Completed'" [class.bg-success]="getJobsForHour(hour).length > 0 && getJobsForHour(hour)[0].status === 'Completed'"></div>
          </div>

          <!-- Jobs for this hour -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div *ngFor="let job of getJobsForHour(hour)" 
                 class="group relative p-5 rounded-2xl bg-surface-soft border border-border-soft hover:border-primary/40 transition-all hover:bg-surface-strong/50">
              <div class="flex justify-between items-start mb-4">
                <div class="w-10 h-10 rounded-xl bg-bg-deep flex items-center justify-center text-lg border border-border-soft">
                  <i [class]="job.status === 'Completed' ? 'fa-solid fa-check text-success' : 'fa-solid fa-bolt text-primary'" class="transition-transform group-hover:scale-110"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded-lg"
                      [class.bg-success/10]="job.status === 'Completed'"
                      [class.text-success]="job.status === 'Completed'"
                      [class.bg-primary/10]="job.status !== 'Completed'"
                      [class.text-primary]="job.status !== 'Completed'">
                  {{ job.status }}
                </span>
              </div>
              <h4 class="font-bold text-sm mb-1">{{ job.name }}</h4>
              <p class="text-xs text-text-muted font-mono">{{ job.agentKey }}</p>
              
              <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>

            <!-- Empty state placeholder to maintain timeline rhythm -->
            <div *ngIf="!getJobsForHour(hour).length" class="py-2 opacity-20 border-t border-dashed border-border-soft">
              <span class="text-[10px] font-bold text-text-muted uppercase italic">No activity scheduled</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
