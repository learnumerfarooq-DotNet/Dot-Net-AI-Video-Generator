<div class="agent-workspace" *ngIf="agentsStore.activeAgent() as agent">
  <header class="agent-header">
    <div class="agent-info">
      <div class="agent-icon" style="color: #ff0000; border-color: rgba(255,0,0,0.3)">
        <i class="fa-brands fa-youtube"></i>
      </div>
      <div class="agent-name-stack">
        <h2>{{ agent.name }}</h2>
        <div class="agent-status">
          <span class="status-dot" [class.active]="agent.isConnected"></span>
          {{ agent.isConnected ? 'Connected' : 'Disconnected' }} &bull; Publishing Agent
        </div>
      </div>
    </div>
    <button type="button" class="ghost-button"
            (click)="rootStore.setSection('settings'); rootStore.setSideTab('settings-' + agent.key)">
      <i class="fa-solid fa-sliders"></i>
      <span>Agent Config</span>
    </button>
  </header>

  <div class="agent-layout">
    <!-- Chat section -->
    <app-agent-chat [agent]="agent"></app-agent-chat>

    <!-- API Configuration sidebar -->
    <aside class="detail-section">
      <section class="detail-card api-config-card">
        <h3><i class="fa-brands fa-youtube"></i> YouTube API</h3>
        <p class="config-note">Enter your Google OAuth credentials to enable video uploads.</p>

        <form [formGroup]="apiForm" (ngSubmit)="saveConfig()">
          <label class="field">
            <span>Client ID <span class="required">*</span></span>
            <input type="text" formControlName="clientId" placeholder="Google OAuth Client ID"
                   [class.invalid]="apiForm.get('clientId')?.invalid && apiForm.get('clientId')?.touched" />
            <span class="field-error" *ngIf="apiForm.get('clientId')?.invalid && apiForm.get('clientId')?.touched">
              Client ID is required
            </span>
          </label>

          <label class="field">
            <span>Client Secret <span class="required">*</span></span>
            <input type="password" formControlName="clientSecret" placeholder="OAuth Client Secret"
                   [class.invalid]="apiForm.get('clientSecret')?.invalid && apiForm.get('clientSecret')?.touched" />
            <span class="field-error" *ngIf="apiForm.get('clientSecret')?.invalid && apiForm.get('clientSecret')?.touched">
              Client Secret is required
            </span>
          </label>

          <label class="field">
            <span>Refresh Token</span>
            <input type="password" formControlName="refreshToken" placeholder="Offline access refresh token" />
          </label>

          <button type="submit" class="primary-button" [disabled]="!apiForm.valid">
            <i class="fa-solid" [class.fa-floppy-disk]="!saved" [class.fa-check]="saved"></i>
            {{ saved ? 'Saved!' : 'Save Configuration' }}
          </button>
        </form>
      </section>

      <section class="detail-card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Runs</h3>
        <div class="list-stack">
          <div class="list-item" *ngFor="let run of agent.recentRuns">
            <div class="item-info">
              <div class="item-title">{{ run.title }}</div>
              <div class="item-meta">{{ run.status }}</div>
            </div>
            <span class="item-meta">{{ run.queuedAt | date:'h:mm a' }}</span>
          </div>
        </div>
      </section>
    </aside>
  </div>
</div>
