<ng-container *ngIf="agentsStore.activeAgent() as agent">
  <div class="flex-1 flex flex-col p-4 min-h-0 overflow-hidden">
    <header class="flex justify-between items-center mb-4 bg-surface p-3 rounded-xl border border-border-soft shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
          <i class="fa-brands fa-youtube text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-base font-bold">{{ agent.name }}</h2>
            <span class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider"
                  [ngClass]="agent.isConnected ? 'bg-accent-green/10 text-accent-green border border-accent-green/20' : 'bg-surface-strong text-text-secondary border border-border-soft'">
              {{ agent.isConnected ? 'Connected' : 'Idle' }}
            </span>
          </div>
          <div class="text-[10px] text-text-secondary uppercase tracking-wider font-bold mt-0.5">YouTube Publishing • {{ agent.category }}</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <!-- AI Connection Status -->
        <div class="flex flex-col items-end">
          <span class="text-[9px] text-text-secondary uppercase font-bold mb-1">AI Brain</span>
          <span class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider"
                [ngClass]="agent.isConnected ? 'bg-accent-green/10 text-accent-green border border-accent-green/20' : 'bg-surface-strong text-text-secondary border border-border-soft'">
            {{ agent.isConnected ? 'Connected' : 'Not Setup' }}
          </span>
        </div>

        <!-- Platform Connection Status -->
        <div class="flex flex-col items-end">
          <span class="text-[9px] text-text-secondary uppercase font-bold mb-1">YouTube Account</span>
          <button (click)="connectYouTube()" 
                  class="flex items-center gap-2 px-3 py-1 bg-primary text-white rounded-lg text-[10px] font-bold hover:bg-primary/90 transition-all shadow-md cursor-pointer">
            <i class="fa-brands fa-youtube"></i>
            {{ agent.isConnected ? 'Link Account' : 'Link Account' }}
          </button>
        </div>

        <div class="h-8 w-[1px] bg-border-soft mx-2"></div>

        <button [routerLink]="['/settings', agent.key]"
                class="w-9 h-9 flex items-center justify-center border border-border-soft rounded-lg text-text-secondary hover:text-text-primary hover:bg-bg-card-hover transition-all cursor-pointer"
                title="Configure Agent AI">
          <i class="fa-solid fa-sliders text-xs"></i>
        </button>
      </div>
    </header>

    <div class="agent-layout-split">
      <div class="workspace-left custom-scrollbar">
        <div class="premium-card p-5">
          <div class="flex items-center gap-3 mb-4">
            <i class="fa-solid fa-folder-tree text-primary text-xs"></i>
            <h3 class="text-[10px] font-black text-text-muted uppercase tracking-widest">Project Assets</h3>
          </div>
          <app-drive-explorer [isAgentWorkspace]="true"></app-drive-explorer>
        </div>
      </div>
      <div class="workspace-right">
        <div class="premium-card h-full flex flex-col overflow-hidden">
          <div class="px-4 py-3 border-b border-border-soft shrink-0 flex items-center gap-2">
            <i class="fa-solid fa-message text-primary text-[10px]"></i>
            <span class="text-[10px] font-black text-text-muted uppercase tracking-widest">Chat</span>
          </div>
          <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <app-agent-chat [agent]="agent"></app-agent-chat>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
