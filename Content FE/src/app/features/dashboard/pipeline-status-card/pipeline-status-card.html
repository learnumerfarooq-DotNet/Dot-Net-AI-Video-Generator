<div class="premium-card p-5 animate-fade-in">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h2 class="text-lg font-bold">Pipeline Velocity</h2>
      <p class="text-[10px] font-black text-text-muted uppercase tracking-widest">Active Production Flow</p>
    </div>
    <div class="flex gap-4">
      <div class="text-right">
        <span class="text-[9px] font-black text-success uppercase tracking-widest">Active</span>
        <div class="text-lg font-black leading-tight">{{ activeJobsCount() }}</div>
      </div>
      <div class="w-px h-6 bg-border-soft mt-1"></div>
      <div class="text-right">
        <span class="text-[9px] font-black text-primary uppercase tracking-widest">Today</span>
        <div class="text-lg font-black leading-tight">{{ completedToday() }}</div>
      </div>
    </div>
  </div>

  <!-- Flow Diagram (Condensed) -->
  <div class="flex justify-between items-center relative py-4 mb-6 px-4 bg-bg-deep/40 rounded-xl border border-border-soft">
    <div class="absolute top-1/2 left-8 right-8 h-px bg-border-soft -z-0 opacity-30"></div>
    
    <div *ngFor="let stage of stages; let i = index" class="flex flex-col items-center z-10">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-500 border border-border-soft bg-surface shadow-sm"
           [ngClass]="getStageClass(stage)">
        <i [class]="getStageIcon(stage)" class="text-[10px]"></i>
      </div>
      <span class="text-[8px] font-black mt-2 uppercase tracking-tighter opacity-50">{{ stage }}</span>
    </div>
  </div>

  <!-- Active Jobs (Condensed) -->
  <div class="space-y-3">
    <div *ngFor="let job of activeJobs()" 
         class="flex items-center gap-3 p-3 rounded-xl bg-bg-deep/30 border border-border-soft group hover:bg-bg-deep/50 transition-all">
      <div class="w-8 h-8 rounded-lg bg-primary/5 flex items-center justify-center text-primary">
        <i class="fa-solid fa-bolt-lightning text-xs animate-pulse"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between mb-1.5">
          <span class="font-bold truncate text-[11px]">{{ job.name }}</span>
          <span class="text-[10px] font-black text-primary">{{ job.progress }}%</span>
        </div>
        <div class="w-full bg-bg-deep rounded-full h-1 overflow-hidden shadow-inner">
          <div class="bg-primary h-full rounded-full transition-all duration-1000" 
               [style.width.%]="job.progress"></div>
        </div>
      </div>
    </div>

    <div *ngIf="activeJobs().length === 0" class="text-center py-6">
      <p class="text-[10px] font-black text-text-muted uppercase tracking-widest opacity-40">Pipeline Standby</p>
    </div>
  </div>
</div>
