<div class="premium-card p-5 animate-fade-in" style="animation-delay: 0.2s">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h2 class="text-lg font-bold">Agent Fleet</h2>
      <p class="text-[10px] font-black text-text-muted uppercase tracking-widest">Active Runtime Nodes</p>
    </div>
  </div>

  <div class="space-y-2">
    <div *ngFor="let agent of agents()" 
         class="flex items-center justify-between p-3 rounded-xl bg-surface-soft/30 border border-border-soft hover:bg-surface-soft/50 transition-all group">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-bg-deep flex items-center justify-center text-primary border border-border-soft">
          <i [class]="getAgentIcon(agent.name)" class="text-xs"></i>
        </div>
        <div>
          <div class="font-bold text-[11px]">{{ agent.name }}</div>
          <div class="text-[9px] font-black text-text-muted uppercase tracking-tighter">{{ agent.lastRun }}</div>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="text-right">
          <div class="text-[11px] font-black text-primary">{{ agent.successRate }}</div>
          <div class="text-[8px] font-black text-text-muted uppercase tracking-widest">Sync</div>
        </div>
        <div class="w-2 h-2 rounded-full shadow-[0_0_8px_var(--success)]"
             [class.bg-success]="agent.status === 'Healthy'"
             [class.bg-danger]="agent.status === 'Degraded'"
             [class.animate-pulse]="agent.status === 'Healthy'"></div>
      </div>
    </div>
  </div>
</div>
